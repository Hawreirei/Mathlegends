name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:questions
      # Unit tests with the coverage gate (#46): src/systems at least 80% covered.
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:bundle
      # Smoke test (#47): a short match on desktop and phone screens, in Indonesian and English.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
