name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:questions
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After every deploy (#53): the live site must serve exactly this commit, and a short match must
  # play on it, on a phone screen and a desktop screen, in both languages (e2e/smoke.spec.ts).
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE: https://hawreirei.github.io/Mathlegends/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait until the live site serves this commit
        run: node scripts/wait-live.ts "$SITE" "${{ github.sha }}"
      - run: npx playwright install --with-deps chromium
      - name: Play on the live site
        run: npm run e2e
        env:
          E2E_BASE_URL: ${{ env.SITE }}
